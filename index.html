<!DOCTYPE html>
<html lang="lo"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BB2 - ຊື້ຂາຍໄອດີເກມ</title>
<style>
:root{--bg:#0f1117;--card:#181b25;--bd:#2a2f3d;--tx:#f1f3f8;--mut:#8b93a7;--pk:#f43f7a;--rd:#dc2626;--gr:#34d399;--yl:#facc15;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f5f9;--card:#fff;--bd:#dfe2ea;--tx:#161922;--mut:#5d6579}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Lao","Phetsarath OT",system-ui,sans-serif;padding-bottom:84px}
header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.logo{font-weight:800;color:var(--pk);font-size:22px;flex:1}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 14px}
.red{background:var(--rd);border-color:var(--rd);color:#fff;font-weight:700}
.full{width:100%;padding:13px;margin-top:8px}
.gold{color:var(--yl);border-color:#6b5a1a}
main{padding:14px;max-width:560px;margin:auto}
h2{font-size:19px;margin:6px 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden;margin-bottom:16px}
.card img.th{width:100%;height:200px;object-fit:cover;display:block;background:#222}
.pad{padding:14px}
.tag{display:inline-block;background:#3b1a1f;color:#f87171;padding:4px 12px;border-radius:8px;font-size:13px;font-weight:600}
.price{color:var(--gr);font-weight:700;font-size:18px}
.mut{color:var(--mut);font-size:13px}
input,textarea,select{width:100%;font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:11px;margin:5px 0}
label{font-size:13px;color:var(--mut)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{flex:1;text-align:center;padding:10px 2px;font-size:12px;color:var(--mut);cursor:pointer}
nav div b{display:block;font-size:22px;font-weight:400}
nav .on{color:var(--pk)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.stock{font-size:13px;font-weight:600}.ok{color:var(--gr)}.no{color:#f87171}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--pk);color:#fff;padding:10px 18px;border-radius:12px;z-index:20;display:none}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:15;padding:16px}
.modal>div{background:var(--card);border-radius:16px;padding:18px;width:100%;max-width:420px;max-height:88vh;overflow:auto}
code{background:var(--bg);padding:8px;border-radius:8px;display:block;margin:6px 0;word-break:break-all;user-select:all}
img.qr,img.slip{max-width:100%;border-radius:10px;display:block;margin:8px auto}
.mut a{color:var(--pk)}
</style></head><body>
<header><div class="logo">🎮 BB2</div><span id="hr"></span></header>
<main id="app"></main>
<nav id="nav"></nav><div id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ===== ໃສ່ຄ່າຈາກ Firebase Console > Project settings > Your apps (Web) =====
const CFG={apiKey:"AIzaSyCXKkkqDBYeNRgHDMBPrxq7fDvBfe82Ytk",authDomain:"jksaman-dba51.firebaseapp.com",projectId:"jksaman-dba51",appId:"1:357019137772:web:504dfa0f5854f7f63f97c9"};
// =========================================================================
firebase.initializeApp(CFG);const auth=firebase.auth(),db=firebase.firestore(),INC=firebase.firestore.FieldValue.increment;
const S={me:null,uid:null,items:[],listings:[],vault:[],topups:[],pend:[],users:[],qr:''};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n).toLocaleString('en-US')+' ₭';
const $=s=>document.querySelector(s);
const em=u=>u.trim().toLowerCase()+'@bb2.app';
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2800)}
function resize(file,max=720){return new Promise(r=>{const i=new Image,u=URL.createObjectURL(file);i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',.7))};i.src=u})}
const isAdmin=()=>S.me?.role==='admin';
let tab='shop',q='',gf='',so='',unsubs=[],pub=[];
const err=e=>{console.error(e);toast('ຜິດພາດ: '+(e.code||e.message))};

// ---------- ຂໍ້ມູນສາທາລະນະ (ທຸກຄົນເຫັນ) ----------
pub=[db.collection('items').onSnapshot(s=>{S.items=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.ts-a.ts);soft()},err),
 db.collection('listing').where('sold','==',false).onSnapshot(s=>{S.listings=s.docs.map(d=>({id:d.id,...d.data()}));soft()},err)];
auth.onAuthStateChanged(u=>{unsubs.forEach(f=>f());unsubs=[];S.me=null;S.vault=[];S.topups=[];S.pend=[];S.users=[];S.uid=u?u.uid:null;
 if(u){const U=db.collection('users').doc(u.uid);
  unsubs.push(U.onSnapshot(d=>{const was=isAdmin();S.me=d.exists?d.data():null;if(isAdmin()&&!was)adminSubs();soft()},err),
  db.collection('vault').where('owner','==',u.uid).onSnapshot(s=>{S.vault=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.soldAt-a.soldAt);soft()},err),
  db.collection('topups').where('uid','==',u.uid).onSnapshot(s=>{S.topups=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.ts-a.ts);soft()},err),
  db.doc('settings/qr').onSnapshot(d=>{S.qr=d.exists?d.data().img:'';soft()},()=>{}))}
 render()});
function adminSubs(){unsubs.push(
 db.collection('topups').where('st','==','p').onSnapshot(s=>{S.pend=s.docs.map(d=>({id:d.id,...d.data()}));soft()},err),
 db.collection('users').onSnapshot(s=>{S.users=s.docs.map(d=>({id:d.id,...d.data()}));soft()},err),
 db.collection('vault').onSnapshot(s=>{S.allVault=s.docs.map(d=>({id:d.id,...d.data()}));soft()},err))}
function soft(){const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&$('#app').contains(a))return;render()}

function render(){
 const m=S.me;
 $('#hr').innerHTML=S.uid?(isAdmin()?`<button class="gold" onclick="tab='admin';render()">⚙️ Admin${S.pend.length?' ('+S.pend.length+')':''}</button> `:'')+`<button onclick="auth.signOut();tab='shop'">ອອກ</button>`:`<button class="red" onclick="tab='login';render()">ເຂົ້າສູ່ລະບົບ</button> <button onclick="tab='reg';render()">ສະໝັກ</button>`;
 const T=[['shop','🎮','ເຕີມເກມ'],['hist','🕒','ປະຫວັດ'],['topup','💰','ເຕີມເງິນ'],['prof','👤','ໂປຣໄຟລ໌']];
 $('#nav').innerHTML=T.map(t=>`<div class="${tab===t[0]?'on':''}" onclick="go('${t[0]}')"><b>${t[1]}</b>${t[2]}</div>`).join('');
 if(!CFG.projectId){$('#app').innerHTML='<p class="mut">ຍັງບໍ່ໄດ້ໃສ່ຄ່າ Firebase ໃນໄຟລ໌ index.html (ຕົວແປ CFG)</p>';return}
 if(['hist','topup','prof'].includes(tab)&&!m)tab=S.uid?tab:'login';
 if(tab==='admin'&&!isAdmin())tab='shop';
 $('#app').innerHTML=({shop,hist,topup,prof,login,reg,admin}[tab]||shop)()}
function go(t){if(['hist','topup','prof'].includes(t)&&!S.uid){toast('ກະລຸນາເຂົ້າສູ່ລະບົບກ່ອນ');tab='login'}else tab=t;render()}

// ---------- ຮ້ານ ----------
const cnt=id=>S.listings.filter(l=>l.itemId===id).length;
function shop(){const gs=[...new Set(S.items.map(i=>i.game))];return `<h2>🛒 ບ່ອນຊື້ຂາຍໄອດີເກມ</h2><input placeholder="🔍 ຄົ້ນຫາ..." value="${esc(q)}" oninput="q=this.value;drawList()"><div style="display:flex;gap:8px"><select onchange="gf=this.value;drawList()"><option value="">ທຸກເກມ</option>${gs.map(g=>`<option ${g===gf?'selected':''}>${esc(g)}</option>`).join('')}</select><select onchange="so=this.value;drawList()"><option value="">ໃໝ່ສຸດ</option><option value="a" ${so==='a'?'selected':''}>ລາຄາຕ່ຳ→ສູງ</option><option value="d" ${so==='d'?'selected':''}>ລາຄາສູງ→ຕ່ຳ</option></select></div><div id="lst">${cards()}</div>`}
function drawList(){const e=$('#lst');if(e)e.innerHTML=cards()}
function cards(){let L=S.items.filter(i=>(!gf||i.game===gf)&&(!q||(i.title+' '+i.game).toLowerCase().includes(q.toLowerCase())));if(so)L=[...L].sort((a,b)=>so==='a'?a.price-b.price:b.price-a.price);
 return L.length?L.map(i=>{const n=cnt(i.id);return `<div class="card">${i.img?`<img class="th" src="${i.img}">`:''}<div class="pad"><span class="tag">${esc(i.game)}</span><h3 style="margin:10px 0 6px">${esc(i.title)}</h3><div class="price">${fmt(i.price)}</div><div class="stock ${n?'ok':'no'}">${n?'ເຫຼືອ '+n+' ໄອດີ':'ໝົດແລ້ວ'}</div><button class="red full" ${n?'':'disabled'} onclick="buy('${i.id}')">ຊື້ໄອດີນີ້</button></div></div>`}).join(''):'<p class="mut">ຍັງບໍ່ມີສິນຄ້າ</p>'}
function modal(h){closeM();const d=document.createElement('div');d.className='modal';d.id='md';d.innerHTML='<div>'+h+'</div>';document.body.appendChild(d)}
function closeM(){$('#md')?.remove()}
function buy(id){const i=S.items.find(x=>x.id===id),L=S.listings.filter(l=>l.itemId===id);
 if(!S.me){toast('ກະລຸນາເຂົ້າສູ່ລະບົບກ່ອນ');tab='login';return render()}
 if(!L.length)return toast('ສິນຄ້າໝົດ');if(S.me.bal<L[0].price)return toast('ເງິນບໍ່ພໍ — ກະລຸນາເຕີມເງິນ');
 modal(`<h3>ຢືນຢັນການຊື້</h3><p>${esc(i.title)}<br><span class="price">${fmt(L[0].price)}</span></p><button class="red full" id="cb" onclick="doBuy('${id}')">ຢືນຢັນຊື້</button><button class="full" onclick="closeM()">ຍົກເລີກ</button>`)}
async function doBuy(id){$('#cb').disabled=true;const L=S.listings.filter(l=>l.itemId===id).sort(()=>Math.random()-.5).slice(0,3);
 for(const l of L){try{const b=db.batch();
  b.update(db.doc('users/'+S.uid),{bal:S.me.bal-l.price,lastBuy:l.id});
  b.update(db.doc('listing/'+l.id),{sold:true});
  b.update(db.doc('vault/'+l.id),{owner:S.uid,soldAt:Date.now()});
  await b.commit();const a=(await db.doc('vault/'+l.id).get()).data();
  return modal(`<h3>✅ ຊື້ສຳເລັດ</h3><p>${esc(a.title)}</p><label>ຊື່ຜູ້ໃຊ້</label><code>${esc(a.u)}</code><label>ລະຫັດຜ່ານ</label><code>${esc(a.p)}</code><p class="mut">ເບິ່ງຄືນໄດ້ໃນ "ປະຫວັດ"</p><button class="full" onclick="closeM()">ປິດ</button>`)}catch(e){console.warn(e)}}
 closeM();toast('ຊື້ບໍ່ສຳເລັດ (ອາດມີຄົນຊື້ກ່ອນ ຫຼືເງິນບໍ່ພໍ) ລອງໃໝ່')}

function hist(){return `<h2>🕒 ປະຫວັດການຊື້</h2>`+(S.vault.length?S.vault.map(x=>`<div class="card pad"><span class="tag">${esc(x.game)}</span> <b>${esc(x.title)}</b><div class="price">${fmt(x.price)}</div><label>ຊື່ຜູ້ໃຊ້</label><code>${esc(x.u)}</code><label>ລະຫັດຜ່ານ</label><code>${esc(x.p)}</code><div class="mut">${new Date(x.soldAt).toLocaleString()}</div></div>`).join(''):'<p class="mut">ຍັງບໍ່ມີປະຫວັດ</p>')+
 `<h2>ປະຫວັດເຕີມເງິນ</h2>`+S.topups.map(t=>`<div class="row"><span>${fmt(t.amt)}<br><span class="mut">${new Date(t.ts).toLocaleString()}</span></span><b>${{p:'⏳ ລໍຖ້າ',a:'✅ ສຳເລັດ',r:'❌ ປະຕິເສດ'}[t.st]}</b></div>`).join('')}

// ---------- ເຕີມເງິນ ----------
let slip='';
function topup(){return `<h2>💰 ເຕີມເງິນ</h2><div class="card pad"><p>ຍອດຄົງເຫຼືອ: <span class="price">${fmt(S.me?.bal||0)}</span></p>${S.qr?`<p>1) ສະແກນ QR ເພື່ອໂອນເງິນ</p><img class="qr" src="${S.qr}">`:'<p class="mut">ແອັດມິນຍັງບໍ່ໄດ້ຕັ້ງ QR</p>'}<p>2) ໃສ່ຈຳນວນເງິນ ແລະ ອັບໂຫຼດຮູບສະລິບ</p><input id="amt" type="number" min="1000" placeholder="ຈຳນວນເງິນ (₭)"><input type="file" accept="image/*" onchange="pickSlip(this)"><img id="sp" class="slip" style="display:none"><button class="red full" onclick="sendTopup()">ສົ່ງສະລິບ</button><p class="mut">ແອັດມິນກວດສະລິບແລ້ວຍອດຈະເຂົ້າ</p></div>`}
async function pickSlip(el){if(!el.files[0])return;slip=await resize(el.files[0]);const p=$('#sp');p.src=slip;p.style.display='block'}
async function sendTopup(){const a=+$('#amt').value;if(!a||a<=0)return toast('ໃສ່ຈຳນວນເງິນ');if(!slip)return toast('ກະລຸນາອັບໂຫຼດສະລິບ');
 try{await db.collection('topups').add({uid:S.uid,name:S.me.name,amt:a,slip,st:'p',ts:Date.now()});slip='';toast('ສົ່ງແລ້ວ ລໍຖ້າແອັດມິນກວດ');tab='hist';render()}catch(e){err(e)}}

// ---------- ບັນຊີ ----------
function prof(){return `<h2>👤 ໂປຣໄຟລ໌</h2><div class="card pad"><p>ຜູ້ໃຊ້: <b>${esc(S.me?.name)}</b> ${isAdmin()?'<span class="tag">Admin</span>':''}</p><p>ຍອດເງິນ: <span class="price">${fmt(S.me?.bal||0)}</span></p><label>ປ່ຽນລະຫັດຜ່ານ</label><input id="np" type="password" placeholder="ລະຫັດໃໝ່ (ຢ່າງນ້ອຍ 6 ໂຕ)"><button class="full" onclick="chpw()">ບັນທຶກ</button><button class="full" onclick="auth.signOut();tab='shop'">ອອກຈາກລະບົບ</button></div>`}
async function chpw(){const v=$('#np').value;if(v.length<6)return toast('ລະຫັດສັ້ນເກີນໄປ');try{await auth.currentUser.updatePassword(v);toast('ປ່ຽນແລ້ວ')}catch(e){toast(e.code==='auth/requires-recent-login'?'ກະລຸນາເຂົ້າສູ່ລະບົບໃໝ່ແລ້ວລອງອີກ':'ຜິດພາດ')}}
function login(){return `<h2>ເຂົ້າສູ່ລະບົບ</h2><div class="card pad"><input id="lu" placeholder="ຊື່ຜູ້ໃຊ້"><input id="lp" type="password" placeholder="ລະຫັດຜ່ານ"><button class="red full" onclick="doLogin()">ເຂົ້າສູ່ລະບົບ</button><button class="full" onclick="tab='reg';render()">ຍັງບໍ່ມີບັນຊີ? ສະໝັກ</button></div>`}
async function doLogin(){try{await auth.signInWithEmailAndPassword(em($('#lu').value),$('#lp').value);tab='shop';render()}catch(e){toast('ຊື່ ຫຼື ລະຫັດບໍ່ຖືກ')}}
function reg(){return `<h2>ສະໝັກສະມາຊິກ</h2><div class="card pad"><input id="ru" placeholder="ຊື່ຜູ້ໃຊ້ (a-z 0-9 _ , 3-20 ໂຕ)"><input id="rp" type="password" placeholder="ລະຫັດຜ່ານ (ຢ່າງນ້ອຍ 6 ໂຕ)"><input id="rp2" type="password" placeholder="ຢືນຢັນລະຫັດຜ່ານ"><button class="red full" onclick="doReg()">ສະໝັກ</button></div>`}
async function doReg(){const u=$('#ru').value.trim().toLowerCase(),p=$('#rp').value;if(!/^[a-z0-9_]{3,20}$/.test(u))return toast('ຊື່ໃຊ້ໄດ້ສະເພາະ a-z 0-9 _ (3-20 ໂຕ)');if(p.length<6)return toast('ລະຫັດຕ້ອງ 6 ໂຕຂຶ້ນໄປ');if(p!==$('#rp2').value)return toast('ລະຫັດບໍ່ກົງກັນ');
 try{const c=await auth.createUserWithEmailAndPassword(em(u),p);await db.doc('users/'+c.user.uid).set({name:u,role:'user',bal:0});tab='shop';toast('ສະໝັກສຳເລັດ')}catch(e){toast(e.code==='auth/email-already-in-use'?'ຊື່ນີ້ມີແລ້ວ':'ຜິດພາດ: '+(e.code||e.message))}}

// ---------- ແອັດມິນ ----------
let newImg='';
function admin(){const V=S.allVault||[];
 return `<h2>⚙️ ແອັດມິນ</h2>
 <div class="card pad"><b>➕ ເພີ່ມສິນຄ້າ / ໄອດີ</b><input id="ng" placeholder="ເກມ (ເຊັ່ນ Roblox, Free Fire)"><input id="nt" placeholder="ຊື່ສິນຄ້າ"><input id="np2" type="number" placeholder="ລາຄາ (₭)"><label>ຮູບຕົວຢ່າງ</label><input type="file" accept="image/*" onchange="pickImg(this)"><label>ໜຶ່ງແຖວ = ໜຶ່ງໄອດີ, ຮູບແບບ ຊື່:ລະຫັດ</label><textarea id="na" rows="5" placeholder="user1:pass1&#10;user2:pass2"></textarea><button class="red full" onclick="addItem()">ເພີ່ມສິນຄ້າ</button></div>
 <div class="card pad"><b>📦 ສິນຄ້າ (${S.items.length})</b>${S.items.map(i=>`<div class="row"><span>${esc(i.title)}<br><span class="mut">${esc(i.game)} · ${fmt(i.price)} · ເຫຼືອ ${cnt(i.id)}</span></span><span><button onclick="stockM('${i.id}')">ໄອດີ</button> <button onclick="delItem('${i.id}')">🗑</button></span></div>`).join('')}</div>
 <div class="card pad"><b>🧾 ສະລິບລໍຖ້າກວດ (${S.pend.length})</b>${S.pend.map(t=>`<div style="border-bottom:1px solid var(--bd);padding:10px 0"><b>${esc(t.name)}</b> — ${fmt(t.amt)}<div class="mut">${new Date(t.ts).toLocaleString()}</div><img class="slip" src="${t.slip}" style="max-height:260px"><button class="red" onclick="appr('${t.id}','${t.uid}',${t.amt},1)">✅ ອະນຸມັດ</button> <button onclick="appr('${t.id}','${t.uid}',0,0)">❌ ປະຕິເສດ</button></div>`).join('')}</div>
 <div class="card pad"><b>QR ຮັບເງິນ</b>${S.qr?`<img class="qr" src="${S.qr}" style="max-width:200px">`:''}<input type="file" accept="image/*" onchange="setQr(this)"></div>
 <div class="card pad"><b>👥 ສະມາຊິກ (${S.users.length})</b>${S.users.map(u=>`<div class="row"><span>${esc(u.name)}${u.role==='admin'?' 👑':''}<br><span class="mut">${fmt(u.bal)}</span></span><button onclick="adjM('${u.id}')">ປັບເງິນ</button></div>`).join('')}</div>`}
async function pickImg(el){if(el.files[0])newImg=await resize(el.files[0])}
function parse(t){return t.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const k=l.indexOf(':');return k<0?null:{u:l.slice(0,k).trim(),p:l.slice(k+1).trim()}}).filter(x=>x&&x.u&&x.p)}
async function putAccts(item,list){for(let k=0;k<list.length;k+=200){const b=db.batch();list.slice(k,k+200).forEach(a=>{const id=db.collection('listing').doc().id;
  b.set(db.doc('listing/'+id),{itemId:item.id,price:item.price,sold:false});
  b.set(db.doc('vault/'+id),{itemId:item.id,u:a.u,p:a.p,owner:null,title:item.title,game:item.game,price:item.price})});await b.commit()}}
async function addItem(){const g=$('#ng').value.trim(),t=$('#nt').value.trim(),p=+$('#np2').value,a=parse($('#na').value);
 if(!g||!t||!p)return toast('ກອກຂໍ້ມູນໃຫ້ຄົບ');if(!a.length)return toast('ໃສ່ຢ່າງນ້ອຍ 1 ໄອດີ (ຊື່:ລະຫັດ)');
 try{const r=db.collection('items').doc(),it={id:r.id,game:g,title:t,price:p};await r.set({game:g,title:t,price:p,img:newImg,ts:Date.now()});await putAccts(it,a);newImg='';toast('ເພີ່ມແລ້ວ');tab='admin';render()}catch(e){err(e)}}
function stockM(id){const i=S.items.find(x=>x.id===id),L=(S.allVault||[]).filter(v=>v.itemId===id&&!v.owner);
 modal(`<h3>ໄອດີ: ${esc(i.title)}</h3><p class="mut">ຍັງບໍ່ຂາຍ ${L.length}</p><label>ເພີ່ມຫຼາຍໄອດີ (ຊື່:ລະຫັດ ແຖວລະໄອດີ)</label><textarea id="sa" rows="3"></textarea><button class="red full" onclick="addStock('${id}')">ເພີ່ມ</button>${L.map(v=>`<div class="row"><span>${esc(v.u)} : ${esc(v.p)}</span><button onclick="delAcct('${v.id}','${id}')">🗑</button></div>`).join('')}<button class="full" onclick="closeM()">ປິດ</button>`)}
async function addStock(id){const a=parse($('#sa').value);if(!a.length)return toast('ໃສ່ ຊື່:ລະຫັດ');try{await putAccts(S.items.find(x=>x.id===id),a);toast('ເພີ່ມແລ້ວ');closeM()}catch(e){err(e)}}
async function delAcct(sid,id){try{const b=db.batch();b.delete(db.doc('listing/'+sid));b.delete(db.doc('vault/'+sid));await b.commit();setTimeout(()=>stockM(id),400)}catch(e){err(e)}}
function delItem(id){const i=S.items.find(x=>x.id===id);modal(`<h3>ລຶບສິນຄ້າ?</h3><p>${esc(i.title)}</p><button class="red full" onclick="doDel('${id}')">ລຶບ</button><button class="full" onclick="closeM()">ຍົກເລີກ</button>`)}
async function doDel(id){try{const b=db.batch();b.delete(db.doc('items/'+id));(S.allVault||[]).filter(v=>v.itemId===id&&!v.owner).forEach(v=>{b.delete(db.doc('listing/'+v.id));b.delete(db.doc('vault/'+v.id))});await b.commit();closeM()}catch(e){err(e)}}
async function appr(id,uid,amt,ok){try{const b=db.batch();b.update(db.doc('topups/'+id),{st:ok?'a':'r'});if(ok)b.update(db.doc('users/'+uid),{bal:INC(amt)});await b.commit()}catch(e){err(e)}}
async function setQr(el){if(el.files[0]){try{await db.doc('settings/qr').set({img:await resize(el.files[0],500)});toast('ບັນທຶກແລ້ວ')}catch(e){err(e)}}}
function adjM(id){const u=S.users.find(x=>x.id===id);modal(`<h3>ປັບເງິນ: ${esc(u.name)}</h3><p>ຍອດປັດຈຸບັນ: <b>${fmt(u.bal)}</b></p><input id="aa" type="number" min="1" placeholder="ຈຳນວນເງິນ (₭)"><button class="red full" onclick="doAdj('${id}',1)">➕ ເພີ່ມເງິນ</button><button class="full" onclick="doAdj('${id}',-1)">➖ ລົບເງິນ</button><button class="full" onclick="closeM()">ປິດ</button>`)}
async function doAdj(id,s){const n=+$('#aa').value;if(!n||n<=0)return toast('ໃສ່ຈຳນວນເງິນ');const u=S.users.find(x=>x.id===id);if(s<0&&u.bal<n)return toast('ຍອດບໍ່ພໍລົບ');try{await db.doc('users/'+id).update({bal:INC(s*n)});closeM();toast('ປັບແລ້ວ')}catch(e){err(e)}}
</script></body></html>
